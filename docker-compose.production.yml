version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: p009-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - p009-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: p009-api
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/p009
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
      - redis
    networks:
      - p009-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: p009-worker
    restart: always
    command: ["python", "-m", "app.services.companion.runtime"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/p009
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - p009-net

  postgres:
    image: ankane/pgvector:latest
    container_name: p009-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p009
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - p009-net

  redis:
    image: redis:7-alpine
    container_name: p009-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - p009-net

networks:
  p009-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
